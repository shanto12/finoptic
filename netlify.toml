# Netlify configuration — FinOptic static demo dashboard.
#
# NOTE: the full FastAPI backend is intentionally NOT hosted here. Netlify serves static
# sites and JS/Go serverless functions, not long-lived Python servers. This publishes a
# self-contained static snapshot of the dashboard that renders FinOptic's *real* sample
# output (generated by scripts/build_static_demo.py). The full app runs from the repo.

[build]
  publish = "web"
  command = "python3 -m pip install -e . && python3 scripts/build_static_demo.py"

[build.environment]
  PYTHON_VERSION = "3.12"

# The dashboard's "Download remediation script" link points at the API path; serve the
# generated static script for it in the demo.
[[redirects]]
  from = "/api/v1/export/remediation.sh"
  to = "/remediation.sh"
  status = 200
